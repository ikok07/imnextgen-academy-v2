apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: navlink
  version: default
  rules:
    - name: user_deny_access_to_admin_navlinks
      actions: ["select"]
      roles:
        - user
      condition:
        match:
          expr: "request.resource.attr.disallowedRoles.size() == 0 || !(request.principal.roles.exists(r, r in request.resource.attr.disallowedRoles))"
      effect: EFFECT_ALLOW