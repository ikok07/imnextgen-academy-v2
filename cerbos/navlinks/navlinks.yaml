apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: navlink
  version: default
  rules:
    - name: user_deny_access_to_admin_navlinks
      actions: ["select"]
      roles:
        - user
      condition:
        match:
          expr: principal.roles.some(r => request.resource.attr.disallowedRoles.indexOf(r) == -1)
      effect: EFFECT_ALLOW