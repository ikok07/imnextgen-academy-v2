apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: navlink
  version: default
  rules:
    - name: user_deny_access_to_admin_navlinks
      actions: ["select"]
      roles:
        - user
      condition:
        match:
          expr: has(request.principal.roles) && request.resource.attr.disallowedRoles.exists(d, d in request.principal.roles) == false
      effect: EFFECT_ALLOW