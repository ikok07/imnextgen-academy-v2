apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: navlink
  version: default
  rules:
    - name: deny_access_to_disallowed_roles
      actions: ["select"]
      roles:
        - user
        - admin
      condition:
        match:
          expr: "request.resource.attr.disallowedRoles.size() == 0 || request.principal.roles.exists(r, !(r in request.resource.attr.disallowedRoles))"
      effect: EFFECT_ALLOW